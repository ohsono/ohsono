name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily (00:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # A classic Personal Access Token saved as the repo secret METRICS_TOKEN.
          # Scopes: repo (required). Add read:org for organization stats.
          token: ${{ secrets.METRICS_TOKEN }}
          user: ohsono
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles

          # Languages breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Contribution calendar + current/longest streak (self-hosted streak replacement)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Commit-time habits / activity heatmap
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
